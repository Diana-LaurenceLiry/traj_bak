DWAPlannerROS:
  max_vel_x: 0.80
  min_vel_x: 0.00
  max_vel_y: 0.00
  min_vel_y: 0.00
  max_trans_vel: 0.80
  min_trans_vel: 0.08
  max_rot_vel: 1.50
  min_rot_vel: 0.35

  acc_lim_x: 1.8
  acc_lim_y: 0.0
  acc_lim_theta: 3.0

  yaw_goal_tolerance: 0.20
  xy_goal_tolerance: 0.18
  latch_xy_goal_tolerance: true

  sim_time: 1.2
  sim_granularity: 0.05
  angular_sim_granularity: 0.1
  vx_samples: 12
  vy_samples: 1
  vth_samples: 24

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.25
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.10
  publish_traj_pc: false
  publish_cost_grid_pc: false
